unavailable_leaf_detail:
  - BEA Table 1.3 does not provide the full Z.1 36-leaf taxonomy, including the domestic deposit-issuer split.
  - BEA functional-category totals cannot be equated to Z.1 ROW totals without a separate territorial, derivative, reserve, and direct-investment bridge.
  - Missing or not-applicable BEA price/exchange components remain unavailable; they are never filled with zero.
  - Missing Z.1 FV remains unavailable; a BEA difference is never installed as a balancing adjustment.
  - Quarterly decomposition before 2023Q1 is unavailable; recent agreement cannot certify 2002–2022.
